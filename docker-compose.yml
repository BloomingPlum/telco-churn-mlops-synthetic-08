# =============================================================================
# docker-compose.yml — application services (API + MLflow)
#
# Monitoring lives in docker-compose.monitoring.yml (overlay). Run both:
#   make up        # = docker network create mlops-net + compose up з обома файлами
#   або вручну:
#   docker network create mlops-net
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
#
# Data generation + training (profile "train", не стартують при звичайному up):
#   make model     # = generator → trainer → models/churn_model.pkl + model_metrics.json
# =============================================================================
services:
  # ── Сервіс для генерації даних (profile: train)
  generator:
    build: .
    profiles: ["train"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: python src/generate_dataset_ext.py --samples 50000 --conv-samples 7500
    networks:
      - mlops-net

  # ── Тренування моделі (profile: train)
  # Той самий образ, що й API → ті самі версії scikit-learn/numpy,
  # тому pickle гарантовано завантажиться в API.
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ["train"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./pipelines:/app/pipelines:ro
    environment:
      - DATA_PATH=/app/data/telco_customers.csv
      - MODEL_PATH=/app/models/churn_model.pkl
      - MLFLOW_TRACKING_URI=        # порожньо → тренування без MLflow
    command: python pipelines/train.py
    networks:
      - mlops-net

  # ── FastAPI prediction service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn-api          # фіксоване ім'я для DNS (prometheus target churn-api:8000)
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mlflow
    environment:
      - MODEL_PATH=/app/models/churn_model.pkl
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Якщо MLflow ще не піднявся або моделі немає в registry — швидко
      # переходимо на локальний models/churn_model.pkl (замість ~2 хв retry)
      - MLFLOW_HTTP_REQUEST_MAX_RETRIES=1
      - MLFLOW_HTTP_REQUEST_TIMEOUT=10
    networks:
      - mlops-net
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim не має curl → перевіряємо через python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow
    hostname: mlflow.int
    ports:
        - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=*
    volumes:
      - ./mlartifacts:/mlartifacts
      - ./mlflow_db:/mlflow_db
    # sqlite://// (4 слеші) = абсолютний шлях /mlflow_db/mlflow.db у volume,
    # не залежить від WORKDIR образу
    entrypoint: >
        /bin/sh -c "
        pip install prometheus-flask-exporter &&
        mlflow server
        --backend-store-uri sqlite:////mlflow_db/mlflow.db
        --default-artifact-root /mlartifacts
        --host 0.0.0.0
        --port 5000
        --expose-prometheus /metrics"
    networks:
      - mlops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s


# ── Явна мережа — не залежить від назви папки.
# external: true в обох compose-файлах → однакове визначення при merge і
# жодних конфліктів міток compose. Створюється один раз:
#   docker network create mlops-net      (make up / make model роблять це самі)
networks:
  mlops-net:
    external: true
    name: mlops-net
